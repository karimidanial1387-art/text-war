<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آشتی؟ 🥺</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 80%;
            position: relative;
            transition: all 0.3s ease;
        }

        h2 {
            color: #d63384;
            margin-bottom: 30px;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            left: 20px; /* موقعیت اولیه دکمه خیر */
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .success-message {
            display: none;
            color: #2e7d32;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <div id="content">
            <h2>ملینا خانوم میشه آشتی کنی؟ 🥺❤️</h2>
            <div class="buttons">
                <button id="yesBtn" onclick="sayYes()">بله</button>
                <button id="noBtn">خیر</button>
            </div>
        </div>
        <div id="success" class="success-message">
            ممنون دختر قشنگم 🥰🌹
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const box = document.getElementById('box');

        // تابع برای جابجا کردن دکمه خیر
        function moveNoButton() {
            // پیدا کردن محدودیت‌های باکس برای اینکه دکمه از کادر بیرون نزنه
            const boxWidth = box.clientWidth;
            const boxHeight = box.clientHeight;
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // محاسبه موقعیت تصادفی جدید در محدوده باکس (با کمی فاصله از لبه‌ها)
            const randomX = Math.floor(Math.random() * (boxWidth - btnWidth - 40)) + 20;
            const randomY = Math.floor(Math.random() * (boxHeight - btnHeight - 100)) + 40;

            // اعمال موقعیت جدید
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // فرار دکمه در ویندوز (حرکت موس)
        noBtn.addEventListener('mouseenter', moveNoButton);

        // فرار دکمه در گوشی (لمس دکمه)
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // جلوگیری از کلیک شدن پیش‌فرض
            moveNoButton();
        });

        // وقتی روی بله کلیک شد
        function sayYes() {
            document.getElementById('content').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }
    </script>

</body>
</html>
